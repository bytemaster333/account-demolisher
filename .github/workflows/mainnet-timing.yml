name: Mainnet timing

# the mainnet discovery timing test runs against public mainnet rpc, whose rate
# limits and latency have nothing to do with a given change. it runs here on a
# schedule (and on demand) so a slowdown is still noticed, without blocking ci
# or a release.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainnet-timing
  cancel-in-progress: false

jobs:
  timing:
    name: mainnet discovery timing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Mainnet discovery timing
        run: pnpm test:integration tests/integration/mainnet-discovery-timing.test.ts
