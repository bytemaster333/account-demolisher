name: CI

on:
  push:
    branches: [main]
  pull_request:

# cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # unit tests include the property-based fuzzing (fast-check) and adversarial
      # cases; they are pure/mocked, so no network is required
      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  # Dependency advisories are reported but do not fail the build: the current
  # criticals/highs are transitive (stellar-wallets-kit → @trezor/connect chain)
  # and not yet fixable from here. Surfaced so a newly-introduced,
  # directly-fixable advisory is visible in the run log.
  audit:
    name: dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  # End-to-end + accessibility sweep against the built app with an injected fake
  # wallet (no real signing). Kept as its own job because it installs a browser.
  e2e:
    name: e2e · accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E + axe
        run: pnpm test:e2e
