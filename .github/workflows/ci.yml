name: CI

on:
  push:
    branches: [main]
  pull_request:

# every job only reads the repository; nothing here needs a write token
permissions:
  contents: read

# cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # the project writes no em dashes in code, comments, copy or config. the
      # character is spelled as its utf-8 bytes so this file does not match itself
      # and the pattern does not depend on the runner's locale.
      - name: No em dashes
        run: |
          ! git grep -n $'\xe2\x80\x94' -- src tests public '*.ts' '*.tsx' '*.yml' '*.mjs' '*.mts' '*.sh' Dockerfile Caddyfile .env.example .dockerignore .gitignore

      # unit tests include the property-based fuzzing (fast-check) and adversarial
      # cases; they are pure/mocked, so no network is required
      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  # Dependency audit gated as a release blocker: any high or critical advisory in
  # the production tree fails the build (release.yml runs the same gate). Fixable
  # transitive advisories are patched via the overrides in pnpm-workspace.yaml;
  # nothing is suppressed, so low/moderate findings stay visible in the output.
  # A newly-introduced high/critical will fail here.
  audit:
    name: dependency audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  # Live-testnet integration suite: real round-trips against Horizon, Soroban RPC,
  # and Friendbot (funds throwaway accounts and closes them for real). Kept as its
  # own job because it depends on the public testnet being reachable.
  integration:
    name: integration (live testnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the mainnet discovery timing test measures public mainnet rpc speed, so a
      # rate limit there says nothing about this change. it runs on its own
      # schedule in mainnet-timing.yml instead of blocking here.
      - name: Integration tests
        run: pnpm test:integration --exclude tests/integration/mainnet-discovery-timing.test.ts

  # End-to-end + accessibility sweep against the built app. smoke/accessibility use
  # no wallet; secret-key-close and walletconnect-close drive real testnet closes
  # (a pasted key and a headless WalletConnect wallet). Own job: it installs a
  # browser, and the WalletConnect spec self-skips unless the project id is set.
  e2e:
    name: e2e · accessibility
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || '5e8254e53e856a4b90f676c51efea4d4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E + axe
        run: pnpm test:e2e

  # the production docker image: build it with a custom public config, then run it
  # with no network as its non-root user and check it serves, carries the
  # build-time site url, and can write the metrics store
  container:
    name: docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://smoke.example.test -t account-demolisher:ci .
      - name: Smoke test
        run: .github/scripts/container-smoke.sh account-demolisher:ci https://smoke.example.test

  # static checks of the workflows themselves: syntax and expression errors
  # (actionlint) and permission, injection and pinning problems (zizmor)
  workflows:
    name: workflow lint (actionlint · zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
