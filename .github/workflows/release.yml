name: Release

# Build a release artifact and attach a SIGNED SLSA build-provenance attestation
# to it, so a deployment can verify the artifact was built from this repo by this
# workflow (satisfies the Tranche-3 "provenance-attested releases" criterion).
#
# Cut a GitHub Release (or push a v* tag and publish it) to trigger this. The
# reference deployment then rsyncs the attested artifact rather than an ad-hoc
# local build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/label for the build artifact"
        required: true

permissions:
  contents: write # attach the artifact to the release
  id-token: write # required for keyless signing of the attestation
  attestations: write # write the provenance attestation

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify before release
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # same release blocker as ci.yml: no high or critical advisory may ship in
      # the production dependency tree of an attested artifact
      - name: Dependency audit (high/critical gate)
        run: pnpm audit --prod --audit-level high

      - name: Production build
        # NEXT_PUBLIC_* are inlined at build time, so the released artifact bakes
        # in this config. Repo variables override; the fallbacks are the reference
        # deployment's public values (testnet default, mainnet reachable via the
        # in-app switch behind the unaudited-audit notice). The WalletConnect
        # projectId is a public client identifier, not a secret. Set the prod
        # domain and any secret env (MEDIATOR_SECRET, SOROSWAP_API_KEY, ...) on the
        # deployment host at runtime, not here.
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK || 'testnet' }}
          NEXT_PUBLIC_DEPLOYMENT_MODE: ${{ vars.NEXT_PUBLIC_DEPLOYMENT_MODE || 'reference' }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || '5e8254e53e856a4b90f676c51efea4d4' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://demolisher.app' }}
        run: pnpm build

      - name: Resolve artifact name
        id: meta
        run: echo "name=account-demolisher-${{ github.event.release.tag_name || inputs.tag }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package the built app
        run: tar -czf "${{ steps.meta.outputs.name }}" .next public package.json next.config.ts pnpm-lock.yaml pnpm-workspace.yaml

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.name }}

      - name: Attach artifact to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.meta.outputs.name }}
