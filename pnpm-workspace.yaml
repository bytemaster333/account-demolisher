# pnpm 11+ reads project settings only from this file (not from package.json's
# "pnpm" field or from .npmrc).

# lefthook installs the git hooks from its postinstall script. the rest are
# denied explicitly, matching the pnpm 10 behavior where only lefthook ran.
allowBuilds:
  lefthook: true
  "@reown/appkit": false
  bufferutil: false
  secp256k1: false
  unrs-resolver: false
  utf-8-validate: false

enablePrePostScripts: true

# blend-sdk 3.3.1 pins @stellar/stellar-sdk 16.3.0, which pins axios 1.18.0 (7 high
# and 5 moderate advisories, all fixed in 1.20.0). the sdk's default http client is
# fetch, so axios is not on blend's request path, but it ships in the production
# tree. 1.20.0 is the same version stellar-sdk 17.1+ moved to. drop this once
# blend-sdk depends on an sdk release that carries axios >=1.20.0.
overrides:
  "@stellar/stellar-sdk@16>axios": 1.20.0

  # jayson is reached only through the HOT wallet module of stellar-wallets-kit
  # (@hot-wallet/sdk > @solana/web3.js), which kit.ts never imports. web3.js 1.x asks
  # for jayson ^4.3.0, whose uuid 8 and stream-json 1 carry four moderate advisories.
  # overriding uuid and stream-json alone does not work: stream-json 3 is esm with
  # renamed files, so jayson 4's require('stream-json/streamers/StreamValues') throws.
  # jayson 5.0.0 drops both packages, and web3.js only loads jayson/lib/client/browser,
  # which in 5.0.0 differs from 4.3.0 only in generating ids with crypto.randomUUID.
  "@solana/web3.js@1>jayson": 5.0.0
