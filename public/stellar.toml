# Stellar Ecosystem Proposal 1 (SEP-1) declaration for Account Demolisher.
#
# The presence of this file at the canonical URL is part of the supply-chain
# integrity story:
#
#   https://demolisher.app/.well-known/stellar.toml
#
# The reference deployment serves this file under `.well-known/`. Next.js
# auto-publishes anything under `public/` at the matching path, but the SEP-1
# canonical location is `/.well-known/stellar.toml` — operators should add a
# rewrite (a `next.config.ts` `rewrites()` entry, or an equivalent rule at the
# reverse proxy) so that both paths resolve here.
#
# Embedders that self-host (CEXes, wallets) MUST replace every placeholder
# below with their own operator details and SIGNING_KEY, then re-sign the
# release artifact. The placeholder values are NOT valid for production traffic.

# ---------------------------------------------------------------------------
# General information
# ---------------------------------------------------------------------------

VERSION = "0.0.0"
NETWORK_PASSPHRASE = "Public Global Stellar Network ; September 2015"

# The canonical URL that this TOML attests to. The reference deployment is
# `demolisher.app`. Embedders replace with their own canonical URL.
WEB_AUTH_ENDPOINT = "https://demolisher.app"

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

[DOCUMENTATION]
ORG_NAME = "Account Demolisher"
ORG_URL = "https://demolisher.app"
ORG_LOGO = "https://demolisher.app/icon.svg"
ORG_DESCRIPTION = """
Account Demolisher is an open-source (Apache-2.0) Stellar account-closure
tool. It drains and merges Stellar accounts cleanly across both classic
Stellar operations and Soroban DeFi protocols (Blend, Aquarius, Soroswap,
FxDAO). The reference deployment is operated by the Account Demolisher
project maintainers. Embedders (wallets, exchanges) may self-host with their
own per-deployment mediator key.
"""
ORG_OFFICIAL_EMAIL = "demolisher@demolisher.app"
ORG_SUPPORT_EMAIL = "demolisher-support@demolisher.app"
ORG_GITHUB = "bytemaster333/account-demolisher"
ORG_KEYBASE = ""
ORG_TWITTER = ""
ORG_LICENSING_AUTHORITY = "n/a — Apache-2.0 open source software"

# ---------------------------------------------------------------------------
# Principals (people responsible)
# ---------------------------------------------------------------------------

[[PRINCIPALS]]
name = "Reference Deployment Operator"
email = "demolisher@demolisher.app"
keybase = ""
twitter = ""
github = "bytemaster333"
id_photo_hash = ""
verification_photo_hash = ""

# ---------------------------------------------------------------------------
# Signing keys — intentionally omitted
# ---------------------------------------------------------------------------
#
# Account Demolisher has NO stable signing account to declare here. The exchange
# mediator co-signs its 2-op forward with a PER-FLOW EPHEMERAL key: every close
# derives a fresh throwaway keypair (from a server-held HMAC master), so there is
# no single, long-lived account a SEP-1 SIGNING_KEY / SIGNERS block could name.
# All user-side signing happens client-side (wallet or pasted key) and is never
# transmitted to the server. Declaring a fixed SIGNING_KEY would be misleading,
# so it is omitted by design rather than filled with a placeholder.

# ---------------------------------------------------------------------------
# Currencies — none. The demolisher does not issue assets.
# ---------------------------------------------------------------------------

# (no [[CURRENCIES]] entries)

# ---------------------------------------------------------------------------
# Validators — none. The demolisher does not run validation nodes.
# ---------------------------------------------------------------------------

# (no [[VALIDATORS]] entries)
