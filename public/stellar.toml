# sep-1 declaration for account demolisher, served at
# https://demolisher.app/.well-known/stellar.toml
#
# next.config.ts rewrites /.well-known/stellar.toml to this file and serves it
# with the cors and content-type headers sep-1 asks for, so both paths resolve
# here without an extra proxy rule.
#
# the values below are the reference deployment's operator details. a wallet or
# exchange that self-hosts replaces them with its own details and the canonical
# url of its domain.

VERSION = "1.0.0"
NETWORK_PASSPHRASE = "Public Global Stellar Network ; September 2015"

[DOCUMENTATION]
ORG_NAME = "Account Demolisher"
ORG_URL = "https://demolisher.app"
ORG_LOGO = "https://demolisher.app/logo.png"
ORG_DESCRIPTION = """
Account Demolisher is an open-source (Apache-2.0) Stellar account-closure
tool. It drains and merges Stellar accounts cleanly across both classic
Stellar operations and Soroban DeFi protocols (Blend, Aquarius, Soroswap).
The reference deployment is operated by the Account Demolisher
project maintainers. Embedders (wallets, exchanges) may self-host with their
own per-deployment mediator key.
"""
ORG_OFFICIAL_EMAIL = "salihtorunr@gmail.com"
ORG_SUPPORT_EMAIL = "salihtorunr@gmail.com"
ORG_GITHUB = "bytemaster333/account-demolisher"

# who is responsible for the deployment
[[PRINCIPALS]]
name = "Salih Toruner"
email = "salihtorunr@gmail.com"
github = "bytemaster333"

# no SIGNING_KEY and no WEB_AUTH_ENDPOINT: there is no long-lived account to
# name and no sep-10 web authentication. the exchange mediator signs its 2-op
# forward with a key derived for that one close from a server-held hmac master,
# so each close uses a different throwaway account. users sign in their own
# wallet or with a key pasted into the page, and that key never reaches the
# server.
#
# no [[CURRENCIES]] (the app issues no assets) and no [[VALIDATORS]] (it runs no
# validator).
