# Stellar Ecosystem Proposal 1 (SEP-1) declaration for Account Demolisher.
#
# The presence of this file at the canonical URL is part of the supply-chain
# integrity story:
#
#   https://demolisher.app/.well-known/stellar.toml
#
# next.config.ts rewrites /.well-known/stellar.toml to this file and serves it
# with the CORS and content-type headers SEP-1 requires, so both paths resolve
# here with no extra proxy rule.
#
# The values below are the reference deployment's real operator details.
# Embedders that self-host (CEXes, wallets) MUST replace them with their own
# operator details and canonical URL for their domain.

# ---------------------------------------------------------------------------
# General information
# ---------------------------------------------------------------------------

VERSION = "1.0.0"
NETWORK_PASSPHRASE = "Public Global Stellar Network ; September 2015"

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

[DOCUMENTATION]
ORG_NAME = "Account Demolisher"
ORG_URL = "https://demolisher.app"
ORG_LOGO = "https://demolisher.app/logo.png"
ORG_DESCRIPTION = """
Account Demolisher is an open-source (Apache-2.0) Stellar account-closure
tool. It drains and merges Stellar accounts cleanly across both classic
Stellar operations and Soroban DeFi protocols (Blend, Aquarius, Soroswap).
The reference deployment is operated by the Account Demolisher
project maintainers. Embedders (wallets, exchanges) may self-host with their
own per-deployment mediator key.
"""
ORG_OFFICIAL_EMAIL = "salihtorunr@gmail.com"
ORG_SUPPORT_EMAIL = "salihtorunr@gmail.com"
ORG_GITHUB = "bytemaster333/account-demolisher"

# ---------------------------------------------------------------------------
# Principals (people responsible)
# ---------------------------------------------------------------------------

[[PRINCIPALS]]
name = "Salih Toruner"
email = "salihtorunr@gmail.com"
github = "bytemaster333"

# ---------------------------------------------------------------------------
# Signing keys and SEP-10: intentionally omitted
# ---------------------------------------------------------------------------
#
# Account Demolisher has NO stable signing account to declare here, and it runs
# no SEP-10 web authentication, so there is no SIGNING_KEY and no
# WEB_AUTH_ENDPOINT. The exchange mediator co-signs its 2-op forward with a
# PER-FLOW EPHEMERAL key: every close derives a fresh throwaway keypair (from a
# server-held HMAC master), so there is no single, long-lived account a SEP-1
# SIGNING_KEY / SIGNERS block could name. All user-side signing happens
# client-side (wallet or pasted key) and is never transmitted to the server.

# ---------------------------------------------------------------------------
# Currencies: none. The demolisher does not issue assets.
# ---------------------------------------------------------------------------

# (no [[CURRENCIES]] entries)

# ---------------------------------------------------------------------------
# Validators: none. The demolisher does not run validation nodes.
# ---------------------------------------------------------------------------

# (no [[VALIDATORS]] entries)
